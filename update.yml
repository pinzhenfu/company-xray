name: 每日更新資料並部署網站

on:
  schedule:
    - cron: "17 0 * * *"    # 台灣時間 08:17
    - cron: "17 10 * * *"   # 台灣時間 18:17（收盤後）
  workflow_dispatch:         # 可在 Actions 分頁手動按「Run workflow」
  push:
    branches: [main]
    paths-ignore: ["site/data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安裝套件
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: 快取 FinBERT 模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: finbert-tone-chinese-v1

      - name: 抓資料、跑 FinBERT
        run: python update_data.py

      - name: 把新資料存回專案
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "自動更新資料 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git pull --rebase --autostash || true
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
